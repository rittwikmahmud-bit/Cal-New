name: Android CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Environment (Keystore & Google Services)
        run: |
          # Generate debug.keystore so signing succeeds
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          find . -type d -name "app" -exec cp debug.keystore {}/../debug.keystore \; 2>/dev/null || true

          # Create a perfectly matched google-services.json for package 'com.aistudio.kidscalculator.riddhy'
          cat << 'EOF' > google-services-template.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "riddhya-calculator",
              "storage_bucket": "riddhya-calculator.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.kidscalculator.riddhy"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fake_api_key_for_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          find . -type d -name "app" -exec cp google-services-template.json {}/google-services.json \;
          find . -type d -name "app" -exec cp google-services-template.json {}/src/google-services.json \;
          find . -type d -name "app" -exec cp google-services-template.json {}/src/debug/google-services.json \;

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project directory: $DIR"
            cd "$DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiddhyasCalculator-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
